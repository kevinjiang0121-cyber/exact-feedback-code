name: CPU reproduction contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: List available experiments
        run: python reproduce.py list
      - name: Run CPU-only contracts
        run: python -m unittest discover -s tests -v
